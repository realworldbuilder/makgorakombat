name: Site

# Chris's live copy: a push to main builds the game and puts it up at https://makgora.clawdioslave.com,
# and redeploys the relay beside it. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# Workers Scripts: Edit and Workers Routes: Edit on the account) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir relay install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --dir relay test
      - name: Build the page for the root of its own site
        run: VITE_BASE=/ pnpm build
      - name: Deploy the relay
        run: pnpm --dir relay exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the site
        run: pnpm --dir relay exec wrangler deploy --config ../site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
