name: Relay

# The relay (relay/: the lobby, quick match, challenges, the board, the rooms) on Cloudflare,
# tested and deployed with wrangler whenever main changes it, so the live one is never older than
# the game. Ship starts it after merging a pull request that touched relay/ (its merges do not
# start push workflows), and it can be run by hand from the Actions tab.
#
# It needs two repository secrets from the Cloudflare account that hosts it: CLOUDFLARE_API_TOKEN
# (a token made from the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. Without
# them it says so and deploys nothing. A deploy restarts the rooms: a fight on at that moment
# drops, and both pages come back to the lobby.

on:
  push:
    branches: [main]
    paths: ['relay/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - name: Is Cloudflare set up?
        id: keys
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets yet, so the relay was not deployed (relay/README.md, Deployed from GitHub)."
            echo ok=false >> "$GITHUB_OUTPUT"
          else
            echo ok=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.keys.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.keys.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - if: steps.keys.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - if: steps.keys.outputs.ok == 'true'
        working-directory: relay
        run: pnpm install --frozen-lockfile
      - if: steps.keys.outputs.ok == 'true'
        working-directory: relay
        run: pnpm build
      # The lobby's tests wait on sockets against the clock and now and then miss on a busy machine.
      - if: steps.keys.outputs.ok == 'true'
        working-directory: relay
        run: pnpm exec vitest run --retry=2
      - if: steps.keys.outputs.ok == 'true'
        name: Deploy
        working-directory: relay
        run: |
          # The game's own domain, if it has one, may use the relay as well as the github.io page.
          origins=""
          if [ -n "$SITE_DOMAIN" ]; then origins="https://$SITE_DOMAIN,https://www.$SITE_DOMAIN"; fi
          pnpm exec wrangler deploy ${origins:+--var "ORIGINS:$origins"} | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "Relay deployed: ${url:-see the log}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$url" ] && [ "$url" != "${RELAY_URL%/}" ]; then
            echo "::notice::The game is not built for this relay yet: set the repository variable RELAY_URL to $url and run Deploy."
          fi
